<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { navy: { 900: '#061426', 800: '#0A1D37', 700: '#10294B' }, electric: '#1D8FE1' },
  fontFamily: { sans: ['Space Grotesk', 'sans-serif'] } } } };
</script>
<style>
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
  body { background: #061426; color: #fff; font-family: 'Space Grotesk', sans-serif; }
  /* dekorasi hero */
  .ring { background: repeating-radial-gradient(circle, transparent 0 7px, rgba(120,170,230,.45) 7px 8px);
    -webkit-mask: radial-gradient(circle, #000 52%, transparent 70%); mask: radial-gradient(circle, #000 52%, transparent 70%); }
  .ring2 { border-radius: 9999px; background: repeating-conic-gradient(rgba(29,143,225,.8) 0 2deg, transparent 2deg 5deg);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%); mask: radial-gradient(circle, transparent 60%, #000 61%); }
  .float { animation: float 8s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translate(-50%,-50%) rotate(0); } 50% { transform: translate(-50%,calc(-50% - 14px)) rotate(5deg); } }
  .float2 { animation: float2 6s ease-in-out infinite; }
  @keyframes float2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .spin { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .marquee { display: flex; width: max-content; animation: mq 30s linear infinite; }
  @keyframes mq { to { transform: translateX(-50%); } }
  /* scroll reveal */
  .rv { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
  .rv.l { transform: translateX(-34px); } .rv.r { transform: translateX(34px); }
  .rv.in { opacity: 1; transform: none; }
  /* overlay & modal */
  .ov { opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s; }
  .ov.show { opacity: 1; visibility: visible; }
  .ov .pane { transform: translateY(22px) scale(.97); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .ov.show .pane { transform: none; }
  /* kartu projek */
  .card { transition: transform .35s ease, box-shadow .35s ease; cursor: pointer; }
  .card:hover { transform: translateY(-8px); box-shadow: 0 20px 44px -14px rgba(29,143,225,.55); }
  .card img.th { transition: transform .6s ease; } .card:hover img.th { transform: scale(1.06); }
  /* form */
  .field { width: 100%; background: #061426; border: 1px solid #1c3a63; border-radius: .6rem; padding: .55rem .75rem; color: #fff; transition: border-color .2s, box-shadow .2s; }
  .field:focus { outline: none; border-color: #1D8FE1; box-shadow: 0 0 0 3px rgba(29,143,225,.25); }
  .lbl { display: block; font-size: .75rem; color: #8fb0d6; margin: .8rem 0 .3rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; background: #1D8FE1; border-radius: 9999px; padding: .65rem 1.5rem; font-weight: 700; font-size: .8rem; letter-spacing: .02em; transition: transform .2s, box-shadow .2s, filter .2s; }
  .btn:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(29,143,225,.8); }
  .btn-o { background: transparent; border: 1px solid #1D8FE1; color: #9fd0f7; }
  .chip { transition: background .25s, border-color .25s, color .25s, transform .25s; }
  .chip:hover { transform: translateY(-2px); }
  a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rv { opacity: 1; transform: none; transition: none; }
    .float, .float2, .marquee, .spin { animation: none; }
    .card, .card img.th, .ov, .ov .pane { transition: none; }
  }
</style>
</head>
<body class="antialiased">

<!-- Loading & toast -->
<div id="loader" class="fixed inset-0 z-[100] hidden items-center justify-center bg-navy-900/85 backdrop-blur-sm">
  <div class="flex flex-col items-center gap-4 px-6 text-center">
    <div class="spin h-12 w-12 rounded-full border-4 border-navy-700 border-t-electric"></div>
    <p id="loaderMsg" class="text-sm text-slate-300">Memuat…</p>
  </div>
</div>
<div id="toast" class="pointer-events-none fixed left-1/2 top-20 z-[110] max-w-[90vw] -translate-x-1/2 -translate-y-3 rounded-full bg-electric px-5 py-2 text-center text-sm font-medium opacity-0 shadow-xl transition-all duration-300"></div>

<!-- Navbar -->
<header id="nav" class="fixed inset-x-0 top-0 z-50 transition-colors duration-300">
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
    <a href="#home" class="flex items-center gap-2 text-lg font-bold">
      <span id="logoMark" class="flex h-7 w-7 items-center justify-center rounded bg-electric text-sm">P</span>
      <span id="logoName" class="max-w-[9rem] truncate">Portofolio</span>
    </a>
    <div class="hidden items-center gap-8 text-xs font-medium tracking-wide text-slate-300 md:flex">
      <a href="#home" class="transition hover:text-white">HOME</a>
      <a href="#about" class="transition hover:text-white">ABOUT ME</a>
      <a href="#experience" class="transition hover:text-white">EXPERIENCE</a>
      <a href="#projects" class="transition hover:text-white">PROJECTS</a>
      <a href="#contact" class="transition hover:text-white">CONTACT</a>
    </div>
    <div class="flex items-center gap-3">
      <a data-contact href="#contact" class="btn hidden sm:inline-flex">LET'S TALK</a>
      <button id="burger" aria-label="Buka menu" aria-expanded="false" class="flex h-10 w-10 items-center justify-center rounded-full border border-navy-700 md:hidden">
        <svg id="burgerIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </nav>
  <div id="mmenu" class="max-h-0 overflow-hidden transition-[max-height] duration-300 md:hidden">
    <div class="mx-auto flex max-w-6xl flex-col gap-1 px-5 pb-5 text-sm font-medium">
      <a href="#home" class="rounded-lg px-3 py-3 hover:bg-navy-700">HOME</a>
      <a href="#about" class="rounded-lg px-3 py-3 hover:bg-navy-700">ABOUT ME</a>
      <a href="#experience" class="rounded-lg px-3 py-3 hover:bg-navy-700">EXPERIENCE</a>
      <a href="#projects" class="rounded-lg px-3 py-3 hover:bg-navy-700">PROJECTS</a>
      <a href="#contact" class="rounded-lg px-3 py-3 hover:bg-navy-700">CONTACT</a>
      <a data-contact href="#contact" class="btn mt-2">LET'S TALK</a>
    </div>
  </div>
</header>

<!-- Hero -->
<section id="home" class="relative overflow-hidden bg-gradient-to-b from-navy-900 to-navy-800 pb-16 pt-28 lg:pt-32">
  <div class="mx-auto grid max-w-6xl items-center gap-12 px-5 lg:grid-cols-2">
    <div class="min-w-0">
      <span id="heroBadge" class="rv inline-block rounded bg-navy-700 px-3 py-1 text-[11px] tracking-widest text-slate-200"></span>
      <h1 class="rv mt-5 text-3xl font-bold uppercase leading-[1.15] sm:text-4xl lg:text-5xl" style="--d:.08s">
        <span id="heroTitle" class="block break-words"></span>
        <span id="heroRole" class="block break-words text-electric"></span>
      </h1>
      <p id="heroDesc" class="rv mt-5 max-w-md break-words text-sm leading-relaxed text-slate-300 sm:text-base" style="--d:.16s"></p>
      <div class="rv mt-8 flex flex-wrap items-center gap-4" style="--d:.24s">
        <a data-contact href="#contact" class="btn">GET IN TOUCH</a>
        <div id="socials" class="flex gap-2"></div>
      </div>
    </div>
    <div class="rv r relative mx-auto w-full max-w-sm lg:max-w-md">
      <div class="ring float pointer-events-none absolute left-1/2 top-1/2 aspect-square w-[135%]"></div>
      <div class="float2 absolute -left-4 top-6 z-20 h-8 w-8 rounded-full bg-gradient-to-br from-[#1c3a63] to-navy-900 shadow-lg"></div>
      <div class="float2 absolute -right-3 bottom-10 z-20 h-10 w-10 rounded-full bg-gradient-to-br from-[#1c3a63] to-navy-900 shadow-lg" style="animation-delay:-3s"></div>
      <div class="relative z-10 overflow-hidden rounded-3xl border border-white/10 bg-gradient-to-b from-[#1c3a63] to-navy-800 shadow-2xl">
        <img id="heroImg" alt="Foto profil" onerror="fb(this,'a')" class="aspect-[4/5] w-full object-cover object-top">
      </div>
    </div>
  </div>
</section>

<!-- Bar keahlian -->
<div class="overflow-hidden border-y border-navy-700 bg-navy-800 py-6">
  <div id="skills" class="marquee gap-12 text-base font-bold text-slate-300 sm:text-lg"></div>
</div>

<!-- About -->
<section id="about" class="bg-navy-900 py-20 sm:py-24">
  <div class="mx-auto grid max-w-6xl items-center gap-14 px-5 lg:grid-cols-2">
    <div class="rv l relative mx-auto w-full max-w-sm">
      <div class="ring2 pointer-events-none absolute -bottom-10 -left-10 h-36 w-36 sm:h-40 sm:w-40"></div>
      <div class="relative overflow-hidden rounded-3xl border border-navy-700 bg-gradient-to-b from-[#1c3a63] to-navy-800 shadow-xl">
        <img id="aboutImg" alt="Foto about" onerror="fb(this,'a')" class="aspect-[4/5] w-full object-cover object-top">
      </div>
    </div>
    <div class="min-w-0">
      <span class="rv inline-block rounded bg-navy-700 px-3 py-1 text-[11px] tracking-widest text-slate-200">ABOUT ME</span>
      <h2 id="aboutTitle" class="rv mt-4 break-words text-2xl font-bold uppercase leading-tight sm:text-3xl" style="--d:.08s"></h2>
      <p id="aboutDesc" class="rv mt-4 max-w-lg whitespace-pre-line break-words text-sm leading-relaxed text-slate-300 sm:text-base" style="--d:.16s"></p>
      <div id="stats" class="mt-8 grid grid-cols-3 gap-3"></div>
      <a data-contact href="#contact" class="btn rv mt-8" style="--d:.3s">GET IN TOUCH</a>
    </div>
  </div>
</section>

<!-- Pengalaman -->
<section id="experience" class="bg-navy-800 py-20 sm:py-24">
  <div class="mx-auto max-w-6xl px-5">
    <span class="rv inline-block rounded bg-navy-700 px-3 py-1 text-[11px] tracking-widest text-slate-200">MY JOURNEY</span>
    <h2 class="rv mt-3 text-2xl font-bold uppercase leading-tight sm:text-3xl" style="--d:.08s">Work Experience &amp; Internship</h2>
    <div id="expList" class="mt-10 space-y-8"></div>
  </div>
</section>

<!-- Projek -->
<section id="projects" class="bg-navy-900 py-20 sm:py-24">
  <div class="mx-auto max-w-6xl px-5">
    <span class="rv inline-block rounded bg-navy-700 px-3 py-1 text-[11px] tracking-widest text-slate-200">MY WORK</span>
    <h2 class="rv mt-3 text-2xl font-bold uppercase sm:text-3xl" style="--d:.08s">Recent Project</h2>
    <div id="filters" class="mt-6 flex flex-wrap gap-2"></div>
    <div id="grid" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </div>
</section>

<!-- Footer -->
<footer id="contact" class="relative bg-navy-800 px-5 pb-28 pt-16 text-center">
  <h2 class="rv text-xl font-bold uppercase sm:text-2xl">Punya projek? <span class="text-electric">Mari bicara.</span></h2>
  <a data-contact href="#contact" class="btn rv mt-6" style="--d:.1s">LET'S TALK</a>
  <p id="footName" class="mt-12 break-words text-xs text-slate-500"></p>
  <button id="lockBtn" aria-label="Login admin" class="absolute bottom-3 right-3 p-2 opacity-20 transition hover:opacity-70">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
  </button>
</footer>

<!-- Admin bar -->
<div id="adminBar" class="fixed bottom-4 left-1/2 z-40 hidden max-w-[94vw] -translate-x-1/2 flex-wrap items-center justify-center gap-2 rounded-3xl border border-electric bg-navy-800/95 px-4 py-2.5 shadow-2xl backdrop-blur">
  <span class="mr-1 text-xs font-bold text-electric">ADMIN</span>
  <button id="aProfil" class="btn btn-o !px-3 !py-1.5 !text-xs">Edit Profil</button>
  <button id="aAdd" class="btn !px-3 !py-1.5 !text-xs">+ Projek</button>
  <button id="aExp" class="btn !px-3 !py-1.5 !text-xs">+ Kerja/PKL</button>
  <button id="aOut" class="btn btn-o !px-3 !py-1.5 !text-xs">Logout</button>
</div>

<!-- Modal -->
<div id="modal" class="ov fixed inset-0 z-[60] flex items-start justify-center overflow-y-auto bg-black/70 p-3 backdrop-blur-sm sm:p-4">
  <div class="pane relative my-6 w-full max-w-2xl rounded-2xl border border-navy-700 bg-navy-800 p-5 shadow-2xl sm:my-10 sm:p-7">
    <button id="mClose" aria-label="Tutup" class="absolute right-3 top-3 flex h-9 w-9 items-center justify-center rounded-full text-2xl text-slate-400 transition hover:bg-navy-700 hover:text-white">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lb" class="ov fixed inset-0 z-[90] flex items-center justify-center bg-black/95">
  <button id="lbX" aria-label="Tutup" class="absolute right-4 top-4 flex h-11 w-11 items-center justify-center rounded-full bg-white/10 text-3xl hover:bg-white/20">&times;</button>
  <button id="lbP" aria-label="Foto sebelumnya" class="absolute left-3 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/10 text-3xl hover:bg-white/20">&#8249;</button>
  <img id="lbImg" alt="" class="pane max-h-[86vh] max-w-[92vw] rounded-lg object-contain">
  <button id="lbN" aria-label="Foto berikutnya" class="absolute right-3 top-1/2 flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/10 text-3xl hover:bg-white/20">&#8250;</button>
  <span id="lbC" class="absolute bottom-5 left-1/2 -translate-x-1/2 rounded-full bg-white/10 px-3 py-1 text-xs"></span>
</div>

<script>
const API_URL = "TEMPEL_URL_EXEC_DISINI";

/* ================= KONFIGURASI ================= */
const CONTACT_URL = 'mailto:email@contoh.com';
const SOCIALS = [{ t: 'IG', u: '#' }, { t: 'IN', u: '#' }, { t: 'GH', u: '#' }];
const SKILLS = ['UI Design', 'UX Research', 'Web Design', 'Prototyping', 'Branding', 'Ilustrasi'];
const PROFIL_FIELDS = [
  ['Nama_Lengkap', 'Nama lengkap'], ['Profesi', 'Profesi'], ['Deskripsi_Hero', 'Deskripsi hero', 'ta'],
  ['Judul_About', 'Judul about'], ['Deskripsi_About', 'Deskripsi about', 'ta'],
  ['Stat_1_Angka', 'Statistik 1 — angka'], ['Stat_1_Label', 'Statistik 1 — label'],
  ['Stat_2_Angka', 'Statistik 2 — angka'], ['Stat_2_Label', 'Statistik 2 — label'],
  ['Stat_3_Angka', 'Statistik 3 — angka'], ['Stat_3_Label', 'Statistik 3 — label']];

/* ================= UTIL ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^(https?:\/\/|mailto:)/i.test(String(u || '').trim()) ? String(u).trim() : '';
const state = { profil: {}, projek: [], exp: [], cat: 'Semua', token: localStorage.getItem('tokenSesi') || '' };
const svgUri = s => 'data:image/svg+xml;utf8,' + encodeURIComponent(s);

/* Ilustrasi pengganti saat foto kosong */
function avatar() {
  return svgUri('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c3a63"/><stop offset="1" stop-color="#0A1D37"/></linearGradient><radialGradient id="r" cx=".5" cy=".3" r=".65"><stop offset="0" stop-color="#1D8FE1" stop-opacity=".4"/><stop offset="1" stop-color="#1D8FE1" stop-opacity="0"/></radialGradient><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0fb"/><stop offset="1" stop-color="#3d8fd6"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><rect width="400" height="500" fill="url(#r)"/><circle cx="330" cy="70" r="46" fill="none" stroke="#1D8FE1" stroke-opacity=".35" stroke-dasharray="3 5" stroke-width="6"/><circle cx="200" cy="195" r="68" fill="url(#p)"/><path d="M58 500c0-98 64-156 142-156s142 58 142 156z" fill="url(#p)"/></svg>');
}
function thumb(seed) {
  const c = [['#1D8FE1', '#7c5cff'], ['#12b5cb', '#1D8FE1'], ['#f5a524', '#e5484d']][Math.abs(seed | 0) % 3];
  return svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="640" height="400" fill="#0A1D37"/><circle cx="520" cy="80" r="150" fill="url(#g)" fill-opacity=".35"/><circle cx="90" cy="360" r="130" fill="url(#g)" fill-opacity=".25"/><rect x="90" y="70" width="460" height="260" rx="18" fill="#10294B" stroke="#1c3a63"/><rect x="90" y="70" width="460" height="38" rx="18" fill="#163a66"/><circle cx="116" cy="89" r="5" fill="#e5484d"/><circle cx="134" cy="89" r="5" fill="#f5a524"/><circle cx="152" cy="89" r="5" fill="#30a46c"/><rect x="118" y="134" width="190" height="16" rx="8" fill="url(#g)"/><rect x="118" y="164" width="260" height="10" rx="5" fill="#2a4a78"/><rect x="118" y="184" width="220" height="10" rx="5" fill="#2a4a78"/><rect x="118" y="230" width="96" height="70" rx="10" fill="#1c3a63"/><rect x="226" y="230" width="96" height="70" rx="10" fill="#1c3a63"/><rect x="334" y="230" width="96" height="70" rx="10" fill="url(#g)" fill-opacity=".8"/></svg>`);
}
function fb(img, kind) { img.onerror = null; img.src = kind === 'a' ? avatar() : thumb(0); }

function parseGal(s) {
  s = String(s || '').trim(); if (!s) return [];
  let a; try { a = JSON.parse(s); } catch (e) { a = s.split(','); }
  return (Array.isArray(a) ? a : []).map(x => safeUrl(String(x))).filter(Boolean);
}
function embedUrl(u) {
  u = String(u || ''); if (!u) return '';
  let m = u.match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/);
  if (m) return 'https://www.youtube.com/embed/' + m[1];
  if (/drive\.google\.com/.test(u)) {
    m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/);
    if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  }
  return '';
}

/* ---------- Loading, toast, modal ---------- */
function loading(on, msg) {
  $('#loaderMsg').textContent = msg || 'Memuat…';
  $('#loader').classList.toggle('hidden', !on);
  $('#loader').classList.toggle('flex', on);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  t.classList.remove('opacity-0', '-translate-y-3'); t.classList.add('opacity-100', 'translate-y-0');
  clearTimeout(toast.id);
  toast.id = setTimeout(() => { t.classList.add('opacity-0', '-translate-y-3'); t.classList.remove('opacity-100', 'translate-y-0'); }, 3000);
}
let clearTimer;
function openModal(html) {
  clearTimeout(clearTimer);
  $('#modalBody').innerHTML = html;
  $('#modal').classList.add('show'); $('#modal').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('#modal').classList.remove('show'); document.body.style.overflow = '';
  clearTimer = setTimeout(() => { $('#modalBody').innerHTML = ''; }, 320);
}
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- Lightbox ---------- */
const LB = { urls: [], i: 0 };
function lbShow() {
  $('#lbImg').src = LB.urls[LB.i]; $('#lbC').textContent = (LB.i + 1) + ' / ' + LB.urls.length;
  $('#lbP').style.display = $('#lbN').style.display = LB.urls.length > 1 ? 'flex' : 'none';
}
function openLB(urls, i) { LB.urls = urls; LB.i = i; lbShow(); $('#lb').classList.add('show'); }
function closeLB() { $('#lb').classList.remove('show'); }
const lbGo = d => { LB.i = (LB.i + d + LB.urls.length) % LB.urls.length; lbShow(); };
$('#lbX').onclick = closeLB; $('#lbP').onclick = () => lbGo(-1); $('#lbN').onclick = () => lbGo(1);
$('#lb').addEventListener('mousedown', e => { if (e.target.id === 'lb') closeLB(); });
document.addEventListener('keydown', e => {
  const lbOpen = $('#lb').classList.contains('show');
  if (e.key === 'Escape') { lbOpen ? closeLB() : closeModal(); }
  if (lbOpen && e.key === 'ArrowLeft') lbGo(-1);
  if (lbOpen && e.key === 'ArrowRight') lbGo(1);
});

/* ---------- Scroll reveal ---------- */
const io = 'IntersectionObserver' in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 })
  : null;
function reveal() { $$('.rv:not(.in)').forEach(el => io ? io.observe(el) : el.classList.add('in')); }

/* ---------- Navbar ---------- */
const navEl = $('#nav'), mmenu = $('#mmenu');
function navStyle() {
  const solid = scrollY > 20 || mmenu.style.maxHeight;
  navEl.classList.toggle('bg-navy-900/90', solid); navEl.classList.toggle('backdrop-blur', solid);
  navEl.classList.toggle('border-b', solid); navEl.classList.toggle('border-navy-700', solid);
}
function toggleMenu(open) {
  mmenu.style.maxHeight = open ? mmenu.scrollHeight + 'px' : '';
  $('#burger').setAttribute('aria-expanded', open);

/* ---------- API ---------- */
async function apiGet() {
  const r = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
  return r.json();
}
async function apiPost(payload) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  const j = await r.json();
  if (j.auth === false) logout(true);
  return j;
}
function fileToB64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      const i = new Image();
      i.onerror = () => rej(new Error('File gambar tidak bisa dibaca: ' + f.name));
      i.onload = () => {
        const k = Math.min(1, 1400 / Math.max(i.width, i.height)), c = document.createElement('canvas');
        c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
        const x = c.getContext('2d'), png = f.type === 'image/png';
        if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(i, 0, 0, c.width, c.height);
        const mime = png ? 'image/png' : 'image/jpeg';
        res({ name: f.name, mime, data: c.toDataURL(mime, .85).split(',')[1] });
      };
      i.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

/* ================= GALERI (slider + thumbnail + lightbox) ================= */
const GAL = {}; let galN = 0;
function galHTML(urls, alt, seed) {
  const k = 'g' + (++galN); GAL[k] = urls;
  const multi = urls.length > 1;
  const nav = 'absolute top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-navy-900/70 text-xl backdrop-blur transition hover:bg-electric';
  return `<div class="gal min-w-0" data-k="${k}">
    <div class="relative overflow-hidden rounded-2xl border border-navy-700 bg-navy-700">
      <img src="${esc(urls[0] || thumb(seed))}" alt="${esc(alt)}" onerror="fb(this)" class="gm aspect-[16/10] w-full object-cover transition-opacity duration-200 ${urls.length ? 'cursor-zoom-in' : ''}">
      ${multi ? `<button type="button" class="gp ${nav} left-2" aria-label="Foto sebelumnya">&#8249;</button><button type="button" class="gn ${nav} right-2" aria-label="Foto berikutnya">&#8250;</button>
      <span class="gc absolute bottom-2 right-2 rounded-full bg-navy-900/80 px-2.5 py-1 text-[11px]">1 / ${urls.length}</span>` : ''}
    </div>
    ${multi ? `<div class="mt-2 flex gap-2 overflow-x-auto pb-1">${urls.map((u, i) => `<button type="button" data-t="${i}" class="gt shrink-0 overflow-hidden rounded-lg border-2 transition ${i ? 'border-transparent opacity-60' : 'border-electric'}"><img src="${esc(u)}" alt="" loading="lazy" onerror="fb(this)" class="aspect-[4/3] w-16 object-cover sm:w-20"></button>`).join('')}</div>` : ''}
  </div>`;
}
function bindGal(root) {
  $$('.gal', root).forEach(g => {
    const urls = GAL[g.dataset.k] || [], n = urls.length, main = $('.gm', g); let idx = 0;
    const go = i => {
      if (!n) return; idx = (i + n) % n; main.style.opacity = 0;
      setTimeout(() => { main.src = urls[idx]; main.style.opacity = 1; }, 150);
      $$('.gt', g).forEach((t, j) => { t.classList.toggle('border-electric', j === idx); t.classList.toggle('border-transparent', j !== idx); t.classList.toggle('opacity-60', j !== idx); });
      const c = $('.gc', g); if (c) c.textContent = (idx + 1) + ' / ' + n;
      const t = $$('.gt', g)[idx]; if (t) t.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    };
    const p = $('.gp', g), nx = $('.gn', g);
    if (p) p.onclick = () => go(idx - 1); if (nx) nx.onclick = () => go(idx + 1);
    $$('.gt', g).forEach(t => t.onclick = () => go(+t.dataset.t));
    main.onclick = () => { if (n) openLB(urls, idx); };
  });
}

function jobHTML(t) {
  const out = []; let ul = [];
  const flush = () => {
    if (ul.length) out.push(`<ul class="space-y-2.5">${ul.map(l => `<li class="flex gap-3"><span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-electric"></span><span class="min-w-0 break-words">${esc(l)}</span></li>`).join('')}</ul>`);
    ul = [];
  };
  String(t || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(l => {
    const m = l.match(/^[-•*]\s+(.*)/);
    if (m) ul.push(m[1]); else { flush(); out.push(`<p class="break-words">${esc(l)}</p>`); }
  });
  flush();
  return out.join('') || '<p class="text-slate-500">Belum ada deskripsi jobdesk.</p>';
}

/* Editor foto: preview thumbnail + hapus satuan; single = satu foto saja, multi = banyak foto */
function galEditor(host, urls, single) {
  const st = { urls: [...urls], files: [] };
  host.innerHTML = `<div data-w class="grid grid-cols-3 gap-2 sm:grid-cols-4"></div>
    <label class="mt-3 flex cursor-pointer items-center justify-center rounded-xl border border-dashed border-electric/60 px-3 py-4 text-center text-xs text-slate-300 transition hover:bg-navy-700">
    <input type="file" accept="image/*" ${single ? '' : 'multiple'} class="hidden">${single ? 'Pilih foto dari perangkat' : 'Pilih beberapa foto sekaligus dari perangkat'}</label>`;
  const w = $('[data-w]', host), inp = $('input', host);
  const draw = () => {
    const items = [...st.urls.map((u, i) => ({ u, i, n: 0 })), ...st.files.map((f, i) => ({ u: f.pv, i, n: 1 }))];
    w.innerHTML = items.map(o => `<div class="relative"><img src="${esc(o.u)}" alt="" class="aspect-[4/3] w-full rounded-lg object-cover">
      ${o.n ? '<span class="absolute bottom-1 left-1 rounded bg-electric px-1.5 text-[9px]">baru</span>' : ''}
      <button type="button" data-d="${o.n}:${o.i}" aria-label="Hapus foto" class="absolute right-1 top-1 flex h-6 w-6 items-center justify-center rounded-full bg-red-600 text-xs">&times;</button></div>`).join('')
      || '<p class="col-span-full text-xs text-slate-500">Belum ada foto.</p>';
    $$('[data-d]', w).forEach(b => b.onclick = () => {
      const [n, i] = b.dataset.d.split(':').map(Number);
      if (n) { URL.revokeObjectURL(st.files[i].pv); st.files.splice(i, 1); } else st.urls.splice(i, 1);
      draw();
    });
  };
  inp.onchange = () => {
    let fs = [...inp.files]; inp.value = '';
    if (single) { st.urls = []; st.files.forEach(f => URL.revokeObjectURL(f.pv)); st.files = []; fs = fs.slice(0, 1); }
    fs.forEach(f => { f.pv = URL.createObjectURL(f); st.files.push(f); });
    draw();
  };
  draw(); return st;
}
/* Unggah foto baru satu per satu (dengan progres) dan kembalikan daftar URL final */
async function resolvePhotos(st, label) {
  const out = [...st.urls];
  for (let i = 0; i < st.files.length; i++) {
    loading(true, `${label} ${i + 1}/${st.files.length}…`);
    const j = await apiPost({ action: 'uploadFoto', token: state.token, file: await fileToB64(st.files[i]) });
    if (!j.ok) throw new Error(j.error);
    out.push(j.url);
  }
  return out;
}

    <div>${F('Lokasi', 'Lokasi', x.Lokasi)}</div></div>` +
    T('Deskripsi jobdesk', 'Deskripsi_Jobdesk', x.Deskripsi_Jobdesk, 7, 'Satu poin per baris. Awali dengan tanda minus (-) agar tampil sebagai poin.') +
    '<label class="lbl">Galeri foto dokumentasi (bisa banyak sekaligus)</label><div id="eg"></div>',
    async f => {
      const fields = { ID_Pengalaman: id || '' };
      ['Posisi_Peran', 'Nama_Perusahaan_Instansi', 'Periode_Waktu', 'Lokasi', 'Deskripsi_Jobdesk'].forEach(k => fields[k] = f[k].value);
      fields.Galeri_Foto_URL = JSON.stringify(await resolvePhotos(eg, 'Mengunggah foto dokumentasi'));
      loading(true, 'Menyimpan data…');
      const j = await apiPost({ action: 'savePengalaman', token: state.token, fields });
      if (!j.ok) throw new Error(j.error);
    });
  eg = galEditor($('#eg'), parseGal(x.Galeri_Foto_URL), false);
}
$('#aExp').onclick = () => expForm();

/* ---------- Hapus ---------- */
async function delItem(action, id, label) {
  if (!confirm('Hapus ' + label + '? Tindakan ini tidak bisa dibatalkan.')) return;
  loading(true, 'Menghapus…');
  try {
    const j = await apiPost({ action, token: state.token, id });
    if (!j.ok) throw new Error(j.error);
    toast('Data dihapus.'); await load();
  } catch (err) { toast(err.message); loading(false); }
}

load();
</script>
